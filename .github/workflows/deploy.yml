name: Deploy Frontend to IONOS

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build & Deploy to IONOS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️ Compilar proyecto para producción
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: 🚀 Desplegar a IONOS por FTP / SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.IONOS_FTP_SERVER }}
          username: ${{ secrets.IONOS_FTP_USERNAME }}
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.IONOS_REMOTE_DIR || './' }}
          dangerous-clean-slate: false
